<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>漏洞披露协作</title><style>body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;background:#f4f6f8}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,select,textarea,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}button{background:#7a1f1f;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.ver{border:1px solid #ccc;border-radius:8px;padding:8px;margin:6px 0}.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;margin-right:6px;color:#fff}.cur{background:#1f6b3a}.pub{background:#1f4b8a}.fp{font-family:monospace;font-size:12px;color:#555}</style><h1>开源漏洞披露协作</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>报告协同</h2><div class="grid"><input id="report" type="number" placeholder="报告 ID"><input id="user" type="number" placeholder="用户 ID"><input id="coord" type="number" placeholder="协调员 ID"><input id="status" placeholder="new/triaged/fixing/resolved"><input id="deadline" value="2026-12-31"><input id="reason" placeholder="延期理由"></div><button onclick="setStatus()">更新状态</button><button onclick="extend()">延长保密期</button><button onclick="publish()">按日期披露</button></section><section><h2>材料与公告</h2><input id="material" placeholder="材料名"><textarea id="content" placeholder="材料或公告内容"></textarea><button onclick="evidence()">添加材料</button><button onclick="advisory()">保存公告草稿</button><button onclick="getAdvisory()">读取公告</button></section><section><h2>材料版本</h2><div class="grid"><input id="evid" type="number" placeholder="材料 ID"><input id="expected" type="number" placeholder="基准版本号 expected_version"><input id="verreason" placeholder="修改原因（必填）"></div><textarea id="vercontent" placeholder="新版本内容：在旧版之上续写，不会覆盖任何旧版本" style="width:95%"></textarea><br><button onclick="addVersion()">追加新版本</button> <button onclick="getVersions()">查版本历史</button> <button onclick="confirmAdv()">重新确认公告（协调员）</button><div id="versions"></div><pre id="extra"></pre></section><section><h2>报告详情（含每版指纹/原因/公开内容）</h2><button onclick="view()">查看可见报告</button><div id="detail"></div><pre id="result"></pre></section><script>
const show=(el,x)=>document.querySelector(el).textContent=JSON.stringify(x,null,2);
async function get(u,el='#result'){show(el,await(await fetch(u)).json())}
async function post(u,b,el='#result'){show(el,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}
async function state(){show('#state',await(await fetch('/api/state')).json())}
function setStatus(){post('/api/reports/'+report.value+'/status',{status:status.value,user_id:+coord.value,note:'页面更新'})}
function extend(){post('/api/extensions',{report_id:+report.value,new_deadline:deadline.value,reason:reason.value,coordinator_id:+coord.value})}
function publish(){post('/api/reports/'+report.value+'/publish',{coordinator_id:+coord.value,as_of:deadline.value})}
function evidence(){post('/api/evidence',{report_id:+report.value,name:material.value,content:content.value,classification:'private',uploaded_by:+user.value},'#extra')}
function advisory(){post('/api/advisories',{report_id:+report.value,content:content.value,user_id:+coord.value},'#extra')}
function getAdvisory(){get('/api/reports/'+report.value+'/advisory?user_id='+user.value,'#extra')}
async function addVersion(){
 const r=await fetch('/api/reports/'+report.value+'/evidence/'+evid.value+'/versions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:vercontent.value,reason:verreason.value,user_id:+user.value,expected_version:+expected.value})});
 show('#extra',await r.json()); if(r.status===201) getVersions();
}
async function getVersions(){
 const r=await fetch('/api/reports/'+report.value+'/evidence/'+evid.value+'/versions?user_id='+user.value);
 const data=await r.json(); document.querySelector('#versions').innerHTML=(data.versions||[]).map(v=>
  `<div class="ver"><b>v${v.version}</b> `+
  (v.is_current?'<span class="tag cur">当前</span>':'')+(v.is_published?'<span class="tag pub">已公开</span>':'')+
  `<div>${v.author_name} · ${v.created_at}</div><div>原因：${v.reason||'-'}</div>`+
  `<pre>${v.content}</pre><div class="fp">${v.fingerprint}</div></div>`).join('');
 if(r.status!==200) show('#extra',data);
}
function confirmAdv(){post('/api/reports/'+report.value+'/advisory/confirm',{coordinator_id:+coord.value},'#extra')}
async function view(){
 const data=await(await fetch('/api/reports/'+report.value+'?user_id='+user.value)).json();
 show('#result',data);
 if(!data.evidence){document.querySelector('#detail').innerHTML='';return}
 document.querySelector('#detail').innerHTML=data.evidence.map(e=>
  `<div class="ver"><b>材料 #${e.id} ${e.name}</b>（当前 v${e.current_version}，公开 v${e.published_version??'-'}）`+
  e.versions.map(v=>`<div class="ver">v${v.version}`+(v.is_current?' <span class="tag cur">当前</span>':'')+(v.is_published?' <span class="tag pub">已公开</span>':'')+
   ` · ${v.author_name} · ${v.created_at}<div>原因：${v.reason||'-'}</div><div class="fp">${v.fingerprint}</div></div>`).join('')+
  `<div>当前公开内容：<pre>${e.published_content??'（尚未公开）'}</pre></div></div>`).join('');
}
state()</script></html>
